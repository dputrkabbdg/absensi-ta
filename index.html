<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Online</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px 0;
    }
    
    .card-main {
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .card-header-custom {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 25px;
      text-align: center;
    }
    
    .card-header-custom h3 {
      margin: 0;
      font-weight: 700;
    }
    
    .card-header-custom p {
      margin: 5px 0 0 0;
      opacity: 0.8;
      font-size: 14px;
    }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
    }
    
    #video, #canvas, #capturedPhoto {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
    }
    
    #canvas, #capturedPhoto {
      display: none;
    }
    
    .btn-absen {
      border-radius: 50px;
      padding: 12px 30px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      border: none;
    }
    
    .btn-masuk {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }
    
    .btn-masuk:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
      color: white;
    }
    
    .btn-pulang {
      background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
      color: white;
    }
    
    .btn-pulang:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(235, 51, 73, 0.4);
      color: white;
    }
    
    .btn-camera {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 50px;
      padding: 10px 25px;
      font-weight: 500;
    }
    
    .btn-camera:hover {
      color: white;
      transform: translateY(-2px);
    }
    
    .info-box {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .info-item:last-child {
      margin-bottom: 0;
    }
    
    .info-item i {
      width: 30px;
      color: #667eea;
    }
    
    .status-badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status-online {
      background: #d4edda;
      color: #155724;
    }
    
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    
    .loading-overlay.active {
      display: flex;
    }
    
    .spinner-custom {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top: 5px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border-radius: 10px;
    }
    
    .table-container table {
      font-size: 13px;
    }
    
    .nav-tabs-custom {
      border: none;
      margin-bottom: 20px;
    }
    
    .nav-tabs-custom .nav-link {
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-weight: 500;
      color: #666;
      transition: all 0.3s;
    }
    
    .nav-tabs-custom .nav-link.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .clock-display {
      font-size: 2rem;
      font-weight: 700;
      color: #1e3c72;
      text-align: center;
      margin: 10px 0;
    }
    
    .date-display {
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    
    @media (max-width: 576px) {
      .clock-display {
        font-size: 1.5rem;
      }
      
      .btn-absen {
        padding: 10px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-custom"></div>
    <p class="text-white mt-3">Menyimpan data absensi...</p>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card card-main">
          <!-- Header -->
          <div class="card-header-custom">
            <h3><i class="fas fa-clipboard-check me-2"></i>Aplikasi Absensi Online</h3>
            <p>Sistem Absensi Digital dengan Foto & GPS</p>
          </div>
          
          <!-- Body -->
          <div class="card-body p-4">
            <!-- Tabs Navigation -->
            <ul class="nav nav-tabs-custom nav-pills justify-content-center" role="tablist">
              <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="pill" href="#tabAbsen">
                  <i class="fas fa-user-check me-1"></i> Absensi
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" data-bs-toggle="pill" href="#tabRiwayat">
                  <i class="fas fa-history me-1"></i> Riwayat
                </a>
              </li>
            </ul>
            
            <!-- Tab Content -->
            <div class="tab-content">
              <!-- Tab Absensi -->
              <div class="tab-pane fade show active" id="tabAbsen">
                <!-- Jam Digital -->
                <div class="clock-display" id="clockDisplay">00:00:00</div>
                <div class="date-display" id="dateDisplay">Memuat tanggal...</div>
                
                <!-- Form Data -->
                <div class="row mt-4">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">
                      <i class="fas fa-user me-1 text-primary"></i> Nama Lengkap
                    </label>
                    <input type="text" class="form-control" id="inputNama" 
                           placeholder="Masukkan nama lengkap">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">
                      <i class="fas fa-briefcase me-1 text-primary"></i> Jabatan
                    </label>
                    <input type="text" class="form-control" id="inputJabatan" 
                           placeholder="Masukkan jabatan">
                  </div>
                  <div class="col-md-12 mb-3">
                    <label class="form-label fw-semibold">
                      <i class="fas fa-building me-1 text-primary"></i> Unit Kerja
                    </label>
                    <input type="text" class="form-control" id="inputUnitKerja" 
                           placeholder="Masukkan unit kerja">
                  </div>
                </div>
                
                <!-- Kamera -->
                <div class="text-center mb-3">
                  <label class="form-label fw-semibold d-block">
                    <i class="fas fa-camera me-1 text-primary"></i> Foto Absensi
                  </label>
                  <div class="camera-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <img id="capturedPhoto" alt="Foto Absensi">
                  </div>
                  <div class="mt-3">
                    <button class="btn btn-camera" id="btnStartCamera" onclick="startCamera()">
                      <i class="fas fa-video me-1"></i> Aktifkan Kamera
                    </button>
                    <button class="btn btn-camera" id="btnCapture" onclick="capturePhoto()" style="display:none;">
                      <i class="fas fa-camera me-1"></i> Ambil Foto
                    </button>
                    <button class="btn btn-camera" id="btnRetake" onclick="retakePhoto()" style="display:none;">
                      <i class="fas fa-redo me-1"></i> Ambil Ulang
                    </button>
                  </div>
                </div>
                
                <!-- Info Lokasi -->
                <div class="info-box">
                  <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="koordinatDisplay">Koordinat: Memuat lokasi...</span>
                  </div>
                  <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span id="jamDisplay">Jam: --:--:--</span>
                  </div>
                  <div class="info-item">
                    <i class="fas fa-wifi"></i>
                    <span class="status-badge status-online">
                      <i class="fas fa-circle me-1" style="font-size:8px;"></i> GPS Aktif
                    </span>
                  </div>
                </div>
                
                <!-- Tombol Absen -->
                <div class="row mt-4">
                  <div class="col-6">
                    <button class="btn btn-absen btn-masuk w-100" onclick="absenMasuk()">
                      <i class="fas fa-sign-in-alt me-2"></i> ABSEN MASUK
                    </button>
                  </div>
                  <div class="col-6">
                    <button class="btn btn-absen btn-pulang w-100" onclick="absenPulang()">
                      <i class="fas fa-sign-out-alt me-2"></i> ABSEN PULANG
                    </button>
                  </div>
                </div>
              </div>
              
              <!-- Tab Riwayat -->
              <div class="tab-pane fade" id="tabRiwayat">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="mb-0"><i class="fas fa-history me-2"></i>Riwayat Absensi Hari Ini</h5>
                  <button class="btn btn-sm btn-outline-primary" onclick="loadRiwayat()">
                    <i class="fas fa-sync-alt me-1"></i> Refresh
                  </button>
                </div>
                <div class="table-container">
                  <table class="table table-striped table-hover">
                    <thead class="table-dark">
                      <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Jam</th>
                        <th>Lokasi</th>
                      </tr>
                    </thead>
                    <tbody id="riwayatTable">
                      <tr>
                        <td colspan="5" class="text-center py-4">
                          <i class="fas fa-spinner fa-spin me-2"></i> Memuat data...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // ============================================
    // VARIABEL GLOBAL
    // ============================================
    let stream = null;
    let fotoBase64 = null;
    let koordinat = '';
    let latitude = 0;
    let longitude = 0;
    
    // ============================================
    // JAM DIGITAL
    // ============================================
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = 
        hours + ':' + minutes + ':' + seconds;
      
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('dateDisplay').textContent = 
        now.toLocaleDateString('id-ID', options);
      
      document.getElementById('jamDisplay').textContent = 
        'Jam: ' + hours + ':' + minutes + ':' + seconds;
    }
    
    setInterval(updateClock, 1000);
    updateClock();
    
    // ============================================
    // GEOLOKASI
    // ============================================
    function getLokasi() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            latitude = position.coords.latitude;
            longitude = position.coords.longitude;
            koordinat = latitude.toFixed(6) + ', ' + longitude.toFixed(6);
            document.getElementById('koordinatDisplay').textContent = 
              'Koordinat: ' + koordinat;
          },
          function(error) {
            document.getElementById('koordinatDisplay').textContent = 
              'Koordinat: Gagal mendapatkan lokasi (' + error.message + ')';
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        document.getElementById('koordinatDisplay').textContent = 
          'Koordinat: Browser tidak mendukung Geolocation';
      }
    }
    
    getLokasi();
    setInterval(getLokasi, 30000); // Update lokasi setiap 30 detik
    
    // ============================================
    // KAMERA
    // ============================================
function startCamera() {
  // 1. Cek apakah browser mendukung API kamera
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Browser Anda tidak mendukung akses kamera. Silakan gunakan Chrome, Safari, atau Firefox versi terbaru.');
    return;
  }

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const capturedPhoto = document.getElementById('capturedPhoto');
  
  // 2. Request akses kamera
  navigator.mediaDevices.getUserMedia({ 
    video: { 
      facingMode: 'user', // Kamera depan
      width: { ideal: 640 },
      height: { ideal: 480 }
    } 
  })
  .then(function(mediaStream) {
    stream = mediaStream;
    video.srcObject = stream;
    video.style.display = 'block';
    canvas.style.display = 'none';
    capturedPhoto.style.display = 'none';
    
    document.getElementById('btnStartCamera').style.display = 'none';
    document.getElementById('btnCapture').style.display = 'inline-block';
    document.getElementById('btnRetake').style.display = 'none';
  })
  .catch(function(error) {
    console.error('Error Kamera:', error);
    let pesanError = 'Gagal mengakses kamera.\n\n';
    
    // 3. Berikan pesan error yang spesifik dan solutif
    if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
      pesanError += 'IZIN DITOLAK/DIBLOKIR.\n\n' +
                    'Cara memperbaiki:\n' +
                    '1. Klik ikon "Gembok" 🔒 atau "Pengaturan" di sebelah kiri address bar (URL) browser Anda.\n' +
                    '2. Cari pengaturan "Kamera" atau "Camera".\n' +
                    '3. Ubah dari "Blokir" menjadi "Izinkan" (Allow).\n' +
                    '4. Refresh (muat ulang) halaman ini dan coba lagi.';
    } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
      pesanError += 'Kamera tidak ditemukan pada perangkat ini.';
    } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
      pesanError += 'Kamera sedang digunakan oleh aplikasi/tab lain. Tutup aplikasi lain yang menggunakan kamera.';
    } else {
      pesanError += error.message;
    }
    
    alert(pesanError);
  });
}
    function capturePhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const capturedPhoto = document.getElementById('capturedPhoto');
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
      
      // Tampilkan foto yang diambil
      capturedPhoto.src = fotoBase64;
      video.style.display = 'none';
      canvas.style.display = 'none';
      capturedPhoto.style.display = 'block';
      
      // Stop camera stream
      if (stream) {
        stream.getTracks().forEach(function(track) {
          track.stop();
        });
      }
      
      document.getElementById('btnCapture').style.display = 'none';
      document.getElementById('btnRetake').style.display = 'inline-block';
    }
    
    function retakePhoto() {
      const video = document.getElementById('video');
      const capturedPhoto = document.getElementById('capturedPhoto');
      
      fotoBase64 = null;
      capturedPhoto.style.display = 'none';
      
      startCamera();
    }
    
    // ============================================
    // FUNGSI ABSENSI
    // ============================================
    function absenMasuk() {
      prosesAbsensi('Masuk');
    }
    
    function absenPulang() {
      prosesAbsensi('Pulang');
    }
    
    // ============================================
// GANTI URL INI dengan URL Web App Apps Script Anda
// ============================================
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxKjs-wLQ26YjJ4n_iEKShwbhoFnEL3xHOtRQ0BB9fm29tipotdHxrI8iSc4PYtLi-11Q/exec';

function prosesAbsensi(status) {
  var nama = document.getElementById('inputNama').value.trim();
  var jabatan = document.getElementById('inputJabatan').value.trim();
  var unitKerja = document.getElementById('inputUnitKerja').value.trim();
  
  if (!nama || !jabatan || !unitKerja) {
    alert('Silakan lengkapi Nama, Jabatan, dan Unit Kerja!');
    return;
  }
  if (!fotoBase64) {
    alert('Silakan ambil foto terlebih dahulu!');
    return;
  }
  if (!koordinat) {
    alert('Gagal mendapatkan lokasi. Pastikan GPS aktif!');
    return;
  }
  
  document.getElementById('loadingOverlay').classList.add('active');
  
  var data = {
    nama: nama,
    jabatan: jabatan,
    unitKerja: unitKerja,
    status: status,
    foto: fotoBase64,
    koordinat: koordinat
  };
  
  // Menggunakan fetch API untuk mengirim data ke GAS
  // Catatan: Gunakan 'text/plain' untuk menghindari masalah CORS preflight (OPTIONS) di GAS
  fetch(GAS_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(response => {
    document.getElementById('loadingOverlay').classList.remove('active');
    
    if (response.success) {
      alert('✅ Absensi ' + status + ' berhasil!\n\nNama: ' + nama + '\nJam: ' + document.getElementById('jamDisplay').textContent);
      
      // Reset form
      fotoBase64 = null;
      document.getElementById('inputNama').value = '';
      document.getElementById('inputJabatan').value = '';
      document.getElementById('inputUnitKerja').value = '';
      document.getElementById('capturedPhoto').style.display = 'none';
      document.getElementById('btnRetake').style.display = 'none';
      document.getElementById('btnStartCamera').style.display = 'inline-block';
      
      // Muat ulang riwayat
      loadRiwayat();
    } else {
      alert('❌ Gagal menyimpan absensi: ' + response.message);
    }
  })
  .catch(error => {
    document.getElementById('loadingOverlay').classList.remove('active');
    alert('❌ Error koneksi: ' + error.message);
    console.error('Fetch error:', error);
  });
}

function loadRiwayat() {
  document.getElementById('riwayatTable').innerHTML = 
    '<tr><td colspan="5" class="text-center py-4"><i class="fas fa-spinner fa-spin me-2"></i> Memuat data...</td></tr>';
  
  fetch(GAS_API_URL, {
    method: 'GET'
  })
  .then(response => response.json())
  .then(response => {
    if (response.success && response.data.length > 0) {
      var html = '';
      for (var i = 0; i < response.data.length; i++) {
        var item = response.data[i];
        var badgeClass = item.status === 'Masuk' ? 'bg-success' : 'bg-danger';
        html += '<tr>' +
          '<td>' + item.no + '</td>' +
          '<td>' + item.nama + '<br><small class="text-muted">' + item.jabatan + '</small></td>' +
          '<td><span class="badge ' + badgeClass + '">' + item.status + '</span></td>' +
          '<td>' + item.jamAbsen + '</td>' +
          '<td><small>' + item.koordinat + '</small></td>' +
          '</tr>';
      }
      document.getElementById('riwayatTable').innerHTML = html;
    } else {
      document.getElementById('riwayatTable').innerHTML = 
        '<tr><td colspan="5" class="text-center py-4 text-muted"><i class="fas fa-inbox me-2"></i> Belum ada data absensi hari ini</td></tr>';
    }
  })
  .catch(error => {
    document.getElementById('riwayatTable').innerHTML = 
      '<tr><td colspan="5" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i> Error: ' + error.message + '</td></tr>';
  });
}
    
    // ============================================
    // RIWAYAT ABSENSI
    // ============================================
    function loadRiwayat() {
      document.getElementById('riwayatTable').innerHTML = 
        '<tr><td colspan="5" class="text-center py-4">' +
        '<i class="fas fa-spinner fa-spin me-2"></i> Memuat data...</td></tr>';
      
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success && response.data.length > 0) {
            var html = '';
            for (var i = 0; i < response.data.length; i++) {
              var item = response.data[i];
              var badgeClass = item.status === 'Masuk' ? 'bg-success' : 'bg-danger';
              html += '<tr>' +
                '<td>' + item.no + '</td>' +
                '<td>' + item.nama + '<br><small class="text-muted">' + item.jabatan + '</small></td>' +
                '<td><span class="badge ' + badgeClass + '">' + item.status + '</span></td>' +
                '<td>' + item.jamAbsen + '</td>' +
                '<td><small>' + item.koordinat + '</small></td>' +
                '</tr>';
            }
            document.getElementById('riwayatTable').innerHTML = html;
          } else {
            document.getElementById('riwayatTable').innerHTML = 
              '<tr><td colspan="5" class="text-center py-4 text-muted">' +
              '<i class="fas fa-inbox me-2"></i> Belum ada data absensi hari ini</td></tr>';
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('riwayatTable').innerHTML = 
            '<tr><td colspan="5" class="text-center py-4 text-danger">' +
            '<i class="fas fa-exclamation-triangle me-2"></i> Error: ' + error.message + '</td></tr>';
        })
        .getDataHariIni();
    }
    
    // Load riwayat saat tab diklik
    document.querySelector('a[href="#tabRiwayat"]').addEventListener('shown.bs.tab', function() {
      loadRiwayat();
    });
  </script>
</body>
</html>
