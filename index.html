<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi DPUTR Kabupaten Bandung</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px 0; }
    .card-main { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .card-header-custom { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 25px; text-align: center; }
    .card-header-custom h3 { margin: 0; font-weight: 700; }
    .card-header-custom p { margin: 5px 0 0 0; opacity: 0.9; font-size: 14px; }
    .camera-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; border-radius: 15px; overflow: hidden; background: #000; aspect-ratio: 4/3; }
    #video, #canvas, #capturedPhoto { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
    #canvas, #capturedPhoto { display: none; }
    .btn-absen { border-radius: 50px; padding: 12px 30px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; border: none; width: 100%; }
    .btn-submit { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); color: white; }
    .btn-camera { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 50px; padding: 10px 25px; font-weight: 500; }
    .info-box { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-top: 15px; }
    .info-item { display: flex; align-items: center; margin-bottom: 8px; }
    .info-item:last-child { margin-bottom: 0; }
    .info-item i { width: 30px; color: #1e3c72; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    .loading-overlay.active { display: flex; }
    .spinner-custom { width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .clock-display { font-size: 2.5rem; font-weight: 700; color: #1e3c72; text-align: center; margin: 10px 0; }
    .date-display { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    .dinas-fields { background: #e8f4f8; border: 1px dashed #1e3c72; border-radius: 12px; padding: 15px; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-custom"></div>
    <p class="text-white mt-3 fw-bold">Menyimpan data absensi...</p>
    <small class="text-white-50">Mohon tunggu, jangan tutup halaman ini.</small>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card card-main">
          <div class="card-header-custom">
            <h3><i class="fas fa-building me-2"></i>DPUTR Kabupaten Bandung</h3>
            <p>Sistem Absensi Digital Tenaga Ahli</p>
          </div>
          
          <div class="card-body p-4">
            <div class="clock-display" id="clockDisplay">00:00:00</div>
            <div class="date-display" id="dateDisplay">Memuat tanggal...</div>
            
            <form id="formAbsensi" onsubmit="event.preventDefault(); prosesAbsensi();">
              <!-- Jenis Absensi -->
              <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-tag me-1 text-primary"></i> Jenis Absensi</label>
                <select class="form-select form-select-lg" id="jenisAbsensi" onchange="toggleDinasFields()" required>
                  <option value="Masuk">Absen Masuk (Kantor)</option>
                  <option value="Pulang">Absen Pulang (Kantor)</option>
                  <option value="DD">Dinas Dalam (DD)</option>
                  <option value="DL">Dinas Luar (DL)</option>
                </select>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold"><i class="fas fa-user me-1 text-primary"></i> Nama Lengkap</label>
                  <input type="text" class="form-control" id="inputNama" placeholder="Nama sesuai NIP" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold"><i class="fas fa-briefcase me-1 text-primary"></i> Jabatan</label>
                  <input type="text" class="form-control" id="inputJabatan" placeholder="Jabatan" required>
                </div>
                <div class="col-12 mb-3">
                  <label class="form-label fw-semibold"><i class="fas fa-building me-1 text-primary"></i> Unit Kerja</label>
                  <input type="text" class="form-control" id="inputUnitKerja" placeholder="Bidang/Unit Kerja" required>
                </div>
              </div>

              <!-- Field Khusus DD/DL -->
              <div id="dinasFields" class="dinas-fields">
                <h6 class="fw-bold text-primary mb-3"><i class="fas fa-file-alt me-2"></i>Kelengkapan Dinas</h6>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Keterangan Kegiatan</label>
                  <textarea class="form-control" id="keteranganKegiatan" rows="3" placeholder="Jelaskan kegiatan yang akan dilakukan (Contoh: Rapat koordinasi di Balai Kota)"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Upload Surat Tugas <span class="text-danger">*</span></label>
                  <input type="file" class="form-control" id="fileSuratTugas" accept=".pdf,.jpg,.jpeg,.png">
                  <small class="text-muted">Format: PDF, JPG, atau PNG (Maksimal 5MB)</small>
                </div>
              </div>
              
              <!-- Kamera -->
              <div class="text-center mb-3 mt-4">
                <label class="form-label fw-semibold d-block"><i class="fas fa-camera me-1 text-primary"></i> Foto Bukti Absensi</label>
                <div class="camera-container">
                  <video id="video" autoplay playsinline></video>
                  <canvas id="canvas"></canvas>
                  <img id="capturedPhoto" alt="Foto Absensi">
                </div>
                <div class="mt-3">
                  <button type="button" class="btn btn-camera" id="btnStartCamera" onclick="startCamera()">
                    <i class="fas fa-video me-1"></i> Aktifkan Kamera
                  </button>
                  <button type="button" class="btn btn-camera" id="btnCapture" onclick="capturePhoto()" style="display:none;">
                    <i class="fas fa-camera me-1"></i> Ambil Foto
                  </button>
                  <button type="button" class="btn btn-camera" id="btnRetake" onclick="retakePhoto()" style="display:none;">
                    <i class="fas fa-redo me-1"></i> Ambil Ulang
                  </button>
                </div>
              </div>
              
              <!-- Info Lokasi -->
              <div class="info-box">
                <div class="info-item">
                  <i class="fas fa-map-marker-alt"></i>
                  <span id="koordinatDisplay" class="fw-semibold">Koordinat: Memuat lokasi...</span>
                </div>
                <div class="info-item">
                  <i class="fas fa-clock"></i>
                  <span id="jamDisplay">Jam: --:--:--</span>
                </div>
              </div>
              
              <!-- Tombol Submit -->
              <div class="mt-4">
                <button type="submit" class="btn btn-absen btn-submit">
                  <i class="fas fa-paper-plane me-2"></i> KIRIM ABSENSI
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let stream = null;
    let fotoBase64 = null;
    let koordinat = '';
    
    // JAM DIGITAL
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('clockDisplay').textContent = timeStr;
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('jamDisplay').textContent = 'Jam: ' + timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();
    
    // GEOLOKASI
    function getLokasi() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            koordinat = position.coords.latitude.toFixed(6) + ', ' + position.coords.longitude.toFixed(6);
            document.getElementById('koordinatDisplay').textContent = 'Koordinat: ' + koordinat;
            document.getElementById('koordinatDisplay').classList.remove('text-danger');
          },
          function(error) {
            document.getElementById('koordinatDisplay').textContent = 'Koordinat: Gagal (' + error.message + ')';
            document.getElementById('koordinatDisplay').classList.add('text-danger');
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        document.getElementById('koordinatDisplay').textContent = 'Browser tidak mendukung GPS';
      }
    }
    getLokasi();
    
    // TOGGLE FIELD DD/DL
    function toggleDinasFields() {
      const jenis = document.getElementById('jenisAbsensi').value;
      const dinasFields = document.getElementById('dinasFields');
      const ketInput = document.getElementById('keteranganKegiatan');
      const fileInput = document.getElementById('fileSuratTugas');
      
      if (jenis === 'DD' || jenis === 'DL') {
        dinasFields.style.display = 'block';
        ketInput.setAttribute('required', 'required');
        fileInput.setAttribute('required', 'required');
      } else {
        dinasFields.style.display = 'none';
        ketInput.removeAttribute('required');
        fileInput.removeAttribute('required');
        ketInput.value = '';
        fileInput.value = '';
      }
    }
    
    // KAMERA
    function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Browser tidak mendukung akses kamera.');
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
        .then(function(mediaStream) {
          stream = mediaStream;
          const video = document.getElementById('video');
          video.srcObject = stream;
          video.style.display = 'block';
          document.getElementById('canvas').style.display = 'none';
          document.getElementById('capturedPhoto').style.display = 'none';
          
          document.getElementById('btnStartCamera').style.display = 'none';
          document.getElementById('btnCapture').style.display = 'inline-block';
          document.getElementById('btnRetake').style.display = 'none';
        })
        .catch(function(error) {
          alert('Gagal mengakses kamera: ' + error.message);
        });
    }
    
    function compressImage(base64, maxWidth = 640, quality = 0.6) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((maxWidth / width) * height);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = base64;
      });
    }

    async function capturePhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const capturedPhoto = document.getElementById('capturedPhoto');
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      const rawBase64 = canvas.toDataURL('image/jpeg', 0.8);
      const btnCapture = document.getElementById('btnCapture');
      btnCapture.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Memproses...';
      
      fotoBase64 = await compressImage(rawBase64, 640, 0.6);
      
      capturedPhoto.src = fotoBase64;
      video.style.display = 'none';
      canvas.style.display = 'none';
      capturedPhoto.style.display = 'block';
      
      if (stream) stream.getTracks().forEach(track => track.stop());
      
      btnCapture.style.display = 'none';
      btnCapture.innerHTML = '<i class="fas fa-camera me-1"></i> Ambil Foto';
      document.getElementById('btnRetake').style.display = 'inline-block';
    }
    
    function retakePhoto() {
      fotoBase64 = null;
      document.getElementById('capturedPhoto').style.display = 'none';
      startCamera();
    }
    
    // BACA FILE SEBAGAI BASE64
    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // PROSES ABSENSI
    async function prosesAbsensi() {
      const jenis = document.getElementById('jenisAbsensi').value;
      const nama = document.getElementById('inputNama').value.trim();
      const jabatan = document.getElementById('inputJabatan').value.trim();
      const unitKerja = document.getElementById('inputUnitKerja').value.trim();
      const keterangan = document.getElementById('keteranganKegiatan').value.trim();
      const fileSuratTugas = document.getElementById('fileSuratTugas').files[0];
      
      if (!nama || !jabatan || !unitKerja) { alert('Silakan lengkapi Nama, Jabatan, dan Unit Kerja!'); return; }
      if (!fotoBase64) { alert('Silakan ambil foto terlebih dahulu!'); return; }
      if (!koordinat || koordinat.includes('Gagal')) { alert('Gagal mendapatkan lokasi. Pastikan GPS aktif dan izinkan akses lokasi!'); return; }
      
      if ((jenis === 'DD' || jenis === 'DL') && (!keterangan || !fileSuratTugas)) {
        alert('Untuk Dinas Dalam (DD) atau Dinas Luar (DL), Keterangan Kegiatan dan Surat Tugas wajib diisi!');
        return;
      }
      
      let suratTugasBase64 = '';
      if (jenis === 'DD' || jenis === 'DL') {
        if (fileSuratTugas.size > 5 * 1024 * 1024) { // 5MB limit
          alert('Ukuran file Surat Tugas terlalu besar! Maksimal 5MB.');
          return;
        }
        suratTugasBase64 = await readFileAsBase64(fileSuratTugas);
      }
      
      document.getElementById('loadingOverlay').classList.add('active');
      
      const data = { 
        nama, jabatan, unitKerja, 
        status: jenis, 
        foto: fotoBase64, 
        koordinat,
        keterangan: (jenis === 'DD' || jenis === 'DL') ? keterangan : '-',
        suratTugas: suratTugasBase64
      };
      
      const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxKjs-wLQ26YjJ4n_iEKShwbhoFnEL3xHOtRQ0BB9fm29tipotdHxrI8iSc4PYtLi-11Q/exec';
      
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        
        document.getElementById('loadingOverlay').classList.remove('active');
        
        if (result.success) {
          alert('✅ Absensi ' + jenis + ' berhasil disimpan!\n\nTerima kasih, ' + nama);
          document.getElementById('formAbsensi').reset();
          document.getElementById('jenisAbsensi').value = 'Masuk';
          toggleDinasFields(); // Reset tampilan field dinas
          fotoBase64 = null;
          document.getElementById('capturedPhoto').style.display = 'none';
          document.getElementById('btnRetake').style.display = 'none';
          document.getElementById('btnStartCamera').style.display = 'inline-block';
        } else {
          alert('❌ Gagal: ' + result.message);
        }
      } catch (error) {
        document.getElementById('loadingOverlay').classList.remove('active');
        alert('❌ Error koneksi: ' + error.message);
      }
    }
  </script>
</body>
</html>
